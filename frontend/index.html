<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>TaskFlow | DevClub</title>

  <link rel="stylesheet" href="./css/style.css">
</head>

<body>
  <!-- Estrutura principal — Layout - organizar as áreas da aplicação -->
  <div class="app">


    <!-- Menu lateral — Navegação - estruturar navegação principal do DevClub -->
    <aside class="menu-lateral">

      <div class="menu-topo">

        <!-- Identidade DevClub — Navegação - reservar espaço para logo da plataforma -->
        <div class="logo-devclub">

          <!-- Adicione posteriormente sua imagem em frontend/img/ -->
          <img src="" alt="Logo DevClub">

        </div>

        <button class="botao-recolher-menu" type="button">
          &lt;&lt;
        </button>

      </div>


      <!-- Pesquisa lateral — Navegação - disponibilizar campo visual de pesquisa -->
      <div class="pesquisa-menu">

        <input type="search" placeholder="Pesquisar..." aria-label="Pesquisar">

      </div>


      <!-- Links principais — Navegação - organizar acessos da plataforma -->
      <nav class="navegacao-principal">

        <a href="#" class="item-menu">
          <span>Home Dev Club</span>
        </a>

        <a href="#" class="item-menu item-menu-ativo">
          <span>TaskFlow</span>
        </a>

        <a href="#" class="item-menu">
          <span>Hostinger</span>
        </a>

        <a href="#" class="item-menu">
          <span>DevClub Full Stack</span>
        </a>

        <a href="#" class="item-menu">
          <span>Data Club</span>
        </a>

        <a href="#" class="item-menu">
          <span>Front End Club</span>
        </a>

        <a href="#" class="item-menu">
          <span>Gestor de IA</span>
        </a>

        <a href="#" class="item-menu">
          <span>DevClub ELITE</span>
        </a>

        <a href="#" class="item-menu">
          <span>Suporte Humano</span>
        </a>

      </nav>

      <!-- Perfil do aluno — Navegação - exibir identificação visual do usuário -->
<div class="perfil-aluno">

    <div class="foto-perfil">

        <!-- Adicione posteriormente sua imagem em frontend/img/ -->
        <img src="" alt="Foto do aluno">

    </div>

    <div class="dados-perfil">
        <strong>José Viana</strong>
        <span>Aluno DevClub</span>
    </div>

    <!-- Cabeçalho TaskFlow — Apresentação - identificar área de gerenciamento de estudos -->
<header class="cabecalho-taskflow">

    <div class="cabecalho-texto">

        <span class="identificador-pagina">
            TASKFLOW
        </span>

        <h1>Organize seu aprendizado.</h1>

        <p>
            Planeje seus estudos, acompanhe suas tarefas
            e mantenha sua evolução em movimento.
        </p>

    </div>

    <div class="cabecalho-imagem">

        <!-- Adicione posteriormente uma imagem em frontend/img/ -->
        <img src="" alt="Ilustração TaskFlow">

    </div>

</header>


<!-- Barra de ferramentas — Filtros - disponibilizar controles da lista de tarefas -->
<section class="barra-ferramentas">

    <div class="grupo-filtros">

        <button
            id="filtro-todas"
            class="botao-filtro ativo"
            type="button"
        >
            Todas
        </button>

        <button
            id="filtro-hoje"
            class="botao-filtro"
            type="button"
        >
            Hoje
        </button>

        <button
            id="filtro-proximas"
            class="botao-filtro"
            type="button"
        >
            Próximas
        </button>

        <button
            id="filtro-concluidas"
            class="botao-filtro"
            type="button"
        >
            Concluídas
        </button>

    </div>


    <div class="grupo-pesquisa">

        <input
            id="pesquisa-tarefa"
            type="search"
            placeholder="Buscar tarefa..."
        >

        <select id="ordenar-tarefas">

            <option value="recentes">
                Mais recentes
            </option>

            <option value="prazo">
                Prazo
            </option>

            <option value="prioridade">
                Prioridade
            </option>

        </select>

    </div>

  </div>
  <script src="./js/app.js"></script>
</body>

</html>
