<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>TaskFlow | DevClub</title>

  <!-- Devicon — Ícones - disponibilizar ícones das tecnologias -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/devicon.min.css">

  <!-- Font Awesome — Ícones - disponibilizar ícones para conteúdos de carreira -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
  <link rel="stylesheet" href="./css/global/style.css">
</head>

<body>

  <!-- Estrutura principal — Layout - organizar as áreas da aplicação -->
  <div class="app">

    <!-- Menu lateral — Navegação - estruturar navegação principal do DevClub -->
    <aside class="menu-lateral">

      <div class="menu-topo">

        <!-- Identidade DevClub — Navegação - reservar espaço para logo da plataforma -->
        <div class="logo-devclub">
          <img src="./assets/images/devLogo.png" alt="Logo DevClub">
        </div>

        <button class="botao-recolher-menu" type="button">
          &lt;&lt;
        </button>

      </div>

      <!-- Pesquisa lateral — Navegação - disponibilizar campo visual de pesquisa -->
      <div class="pesquisa-menu">

        <input type="search" placeholder="Pesquisar..." aria-label="Pesquisar">

      </div>

      <!-- Links principais — Navegação - organizar acessos da plataforma -->
      <nav class="navegacao-principal">

        <!-- Home — Navegação - permitir retorno à página inicial -->
        <a href="#" id="abrir-home" class="item-menu item-menu-ativo">
          <span>Home Dev Club</span>
        </a>


        <!-- TaskFlow — Navegação - acessar ambiente de estudos -->
        <a href="#" id="abrir-taskflow" class="item-menu">
          <span>TaskFlow</span>
        </a>

        <a href="#" class="item-menu">
          <span>Hostinger</span>
        </a>

        <a href="#" class="item-menu">
          <span>DevClub Full Stack</span>
        </a>

        <a href="#" class="item-menu">
          <span>Data Club</span>
        </a>

        <a href="#" class="item-menu">
          <span>Front End Club</span>
        </a>

        <a href="#" class="item-menu">
          <span>Gestor de IA</span>
        </a>

        <a href="#" class="item-menu">
          <span>DevClub ELITE</span>
        </a>

        <a href="#" class="item-menu">
          <span>Suporte Humano</span>
        </a>

      </nav>

      <!-- Perfil do aluno — Navegação - exibir identificação visual do usuário -->
      <div class="perfil-aluno">

        <div class="foto-perfil">
          <img src="" alt="Foto do aluno">
        </div>

        <div class="dados-perfil">
          <strong>José Viana</strong>
          <span>Aluno DevClub</span>
        </div>

      </div>

    </aside>


    <!-- Conteúdo principal — Layout - controlar as diferentes views da aplicação -->
    <main class="conteudo-principal">


      <!-- ========================================
         VIEW HOME
    ========================================= -->

      <!-- Home — Apresentação - representar página inicial da plataforma -->
      <section id="view-home" class="view view-ativa">

        <!-- Banner principal — Apresentação - reproduzir área visual da Home -->
        <div class="banner-home">

          <img src="./assets/images/principal-home.png" alt="Banner principal DevClub">

        </div>

      </section>



      <!-- ========================================
         VIEW TASKFLOW
    ========================================= -->

      <!-- TaskFlow — Navegação - disponibilizar seleção dos conteúdos de estudo -->
      <section id="view-taskflow" class="view">

        <div class="taskflow-container">


          <!-- Apresentação TaskFlow — Apresentação - orientar seleção de conteúdo -->
          <header class="taskflow-cabecalho">

            <span class="taskflow-identificador">
              TASKFLOW
            </span>

            <h1>
              O que você está estudando?
            </h1>

            <p>
              Escolha um tópico para continuar sua jornada.
            </p>

          </header>



          <!-- Órbita TaskFlow — Layout - organizar tópicos ao redor do elemento central -->
          <div class="taskflow-orbita">


            <!-- Centro TaskFlow — Identidade - representar núcleo da experiência -->
            <div class="taskflow-centro">

              <img src="./assets/images/TaskCentro.png" alt="DevClub TaskFlow">

            </div>



            <!-- ========================================
                     FRONT END
                ========================================= -->

            <!-- Front End — Seleção - disponibilizar conteúdos de desenvolvimento front-end -->

            <button class="topico-taskflow topico-frontend" type="button" data-categoria="frontend" data-topico="html">
              <i class="devicon-html5-plain colored topico-icone"></i>
              <span class="topico-nome">HTML</span>
            </button>


            <button class="topico-taskflow topico-frontend" type="button" data-categoria="frontend" data-topico="css">
              <i class="devicon-css3-plain colored topico-icone"></i>
              <span class="topico-nome">CSS</span>
            </button>


            <button class="topico-taskflow topico-frontend" type="button" data-categoria="frontend"
              data-topico="javascript">
              <i class="devicon-javascript-plain colored topico-icone"></i>
              <span class="topico-nome">JavaScript</span>
            </button>


            <button class="topico-taskflow topico-frontend" type="button" data-categoria="frontend"
              data-topico="typescript">
              <i class="devicon-typescript-plain colored topico-icone"></i>
              <span class="topico-nome">TypeScript</span>
            </button>


            <button class="topico-taskflow topico-frontend" type="button" data-categoria="frontend" data-topico="react">
              <i class="devicon-react-plain colored topico-icone"></i>
              <span class="topico-nome">React</span>
            </button>


            <button class="topico-taskflow topico-frontend" type="button" data-categoria="frontend" data-topico="vite">
              <i class="devicon-vitejs-plain colored topico-icone"></i>
              <span class="topico-nome">Vite</span>
            </button>



            <!-- ========================================
                     BACK END
                ========================================= -->

            <!-- Back End — Seleção - disponibilizar conteúdos de desenvolvimento back-end -->

            <button class="topico-taskflow topico-backend" type="button" data-categoria="backend" data-topico="node">
              <i class="devicon-nodejs-plain colored topico-icone"></i>
              <span class="topico-nome">Node</span>
            </button>


            <button class="topico-taskflow topico-backend" type="button" data-categoria="backend" data-topico="express">
              <i class="devicon-express-plain colored topico-icone"></i>
              <span class="topico-nome">Express</span>
            </button>


            <button class="topico-taskflow topico-backend" type="button" data-categoria="backend" data-topico="fastify">
              <i class="devicon-fastify-plain colored topico-icone"></i>
              <span class="topico-nome">Fastify</span>
            </button>


            <button class="topico-taskflow topico-backend" type="button" data-categoria="backend" data-topico="prisma">
              <i class="devicon-prisma-plain colored topico-icone"></i>
              <span class="topico-nome">Prisma</span>
            </button>


            <button class="topico-taskflow topico-backend" type="button" data-categoria="backend"
              data-topico="postgres">
              <i class="devicon-postgresql-plain colored topico-icone"></i>
              <span class="topico-nome">Postgres</span>
            </button>


            <button class="topico-taskflow topico-backend" type="button" data-categoria="backend" data-topico="mongodb">
              <i class="devicon-mongodb-plain colored topico-icone"></i>
              <span class="topico-nome">MongoDB</span>
            </button>


            <button class="topico-taskflow topico-backend" type="button" data-categoria="backend" data-topico="docker">
              <i class="devicon-docker-plain colored topico-icone"></i>
              <span class="topico-nome">Docker</span>
            </button>



            <!-- ========================================
                     MOBILE
                ========================================= -->

            <!-- Mobile — Seleção - disponibilizar conteúdos de desenvolvimento mobile -->

            <button class="topico-taskflow topico-mobile" type="button" data-categoria="mobile"
              data-topico="react-native">
              <i class="devicon-react-plain colored topico-icone"></i>
              <span class="topico-nome">React Native</span>
            </button>


            <button class="topico-taskflow topico-mobile" type="button" data-categoria="mobile" data-topico="expo">
              <i class="devicon-expo-plain colored topico-icone"></i>
              <span class="topico-nome">Expo</span>
            </button>


            <button class="topico-taskflow topico-mobile" type="button" data-categoria="mobile" data-topico="android">
              <i class="devicon-android-plain colored topico-icone"></i>
              <span class="topico-nome">Android</span>
            </button>


            <button class="topico-taskflow topico-mobile" type="button" data-categoria="mobile" data-topico="ios">
              <i class="devicon-ios-plain colored topico-icone"></i>
              <span class="topico-nome">iOS</span>
            </button>



            <!-- ========================================
                     CARREIRA
                ========================================= -->

            <!-- Carreira — Seleção - disponibilizar conteúdos de desenvolvimento profissional -->
            <button class="topico-taskflow topico-carreira" type="button" data-categoria="carreira"
              data-topico="linkedin">
              <i class="fa-brands fa-linkedin topico-icone icone-linkedin"></i>
              <span class="topico-nome">LinkedIn</span>
            </button>


            <button class="topico-taskflow topico-carreira" type="button" data-categoria="carreira"
              data-topico="curriculo">
              <i class="fa-regular fa-file topico-icone"></i>
              <span class="topico-nome">Currículo</span>
            </button>


            <button class="topico-taskflow topico-carreira" type="button" data-categoria="carreira"
              data-topico="entrevistas">
              <i class="fa-regular fa-user topico-icone"></i>
              <span class="topico-nome">Entrevistas</span>
            </button>


            <button class="topico-taskflow topico-carreira" type="button" data-categoria="carreira"
              data-topico="processos-seletivos">
              <i class="fa-regular fa-list topico-icone"></i>

              <span class="topico-nome">
                Processos seletivos
              </span>
            </button>


          </div>

        </div>

      </section>

    </main>

  </div>

  <script src="./js/core/app.js"></script>

</body>

</html>
